[package]
name = "fastast"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-java = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-html = "0.20"
tree-sitter-css = "0.21"
tiktoken-rs = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
