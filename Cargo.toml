[package]
name = "fastast"
version = "0.2.3"
edition = "2021"
description = "High-performance codebase-memory engine (AST -> Graph -> Retrieval) for coding agents"
authors = ["Abdullah Eqbal <iabdullaheqbal@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/iabdullaheqbal/fastAST"
homepage = "https://github.com/iabdullaheqbal/fastAST"
readme = "README.md"
keywords = ["ast", "code-graph", "retrieval", "sqlite", "mcp"]
categories = ["development-tools", "parsing", "text-processing"]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-java = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-html = "0.20"
tree-sitter-css = "0.21"
tiktoken-rs = "0.5"
tree-sitter-rust = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
