<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0e1524" />
    </linearGradient>
    <linearGradient id="badCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1315" />
      <stop offset="100%" stop-color="#140d10" />
    </linearGradient>
    <linearGradient id="goodCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f231d" />
      <stop offset="100%" stop-color="#0a1814" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="10" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & Prompt Header -->
  <text x="30" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold">Token-Budgeted Retrieval vs. Traditional Agent File Dumps</text>
  <text x="30" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Target Query: "Fix database connection handling in handle_graph"</text>

  <!-- 1. Left Card: Traditional Agent Workflow (Without FastAST) -->
  <rect x="30" y="85" width="455" height="365" rx="8" fill="url(#badCard)" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1.5" />
  <rect x="42" y="100" width="150" height="22" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-opacity="0.6" />
  <text x="50" y="115" fill="#f87171" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">❌ TRADITIONAL AGENT</text>

  <text x="42" y="148" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Naive File Dumps &amp; Grep Sprawl</text>

  <rect x="42" y="162" width="430" height="150" rx="4" fill="#090507" stroke="#450a0a" />
  <text x="54" y="182" fill="#991b1b" font-family="monospace" font-size="11">$ grep -rn "handle_graph" .</text>
  <text x="54" y="200" fill="#f87171" font-family="monospace" font-size="10">→ Found 24 matches across 8 files</text>
  <text x="54" y="222" fill="#ef4444" font-family="monospace" font-size="10">cat python/fastast/api_server.py (1,236 lines)</text>
  <text x="54" y="240" fill="#ef4444" font-family="monospace" font-size="10">cat python/fastast/server.py     (840 lines)</text>
  <text x="54" y="258" fill="#ef4444" font-family="monospace" font-size="10">cat python/fastast/db.py         (910 lines)</text>
  <text x="54" y="276" fill="#ef4444" font-family="monospace" font-size="10">cat tests/test_server.py         (450 lines)</text>
  <text x="54" y="296" fill="#7f1d1d" font-family="monospace" font-size="10">... 4 more files read into context</text>

  <!-- Metrics Bar -->
  <rect x="42" y="325" width="430" height="52" rx="4" fill="#1c0e12" stroke="#7f1d1d" />
  <text x="54" y="345" fill="#f87171" font-family="monospace" font-size="11">Prompt Consumption:</text>
  <text x="210" y="346" fill="#ef4444" font-family="monospace" font-size="16" font-weight="bold">~42,500 Tokens</text>
  <text x="54" y="365" fill="#991b1b" font-family="-apple-system, sans-serif" font-size="10">High latency · Context window rot · Risk of hallucination</text>

  <rect x="42" y="390" width="430" height="42" rx="4" fill="#0b0608" />
  <text x="54" y="414" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">Result: Saturated context, \$0.42 / turn cost</text>

  <!-- 2. Right Card: FastAST Workflow -->
  <rect x="515" y="85" width="455" height="365" rx="8" fill="url(#goodCard)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="527" y="100" width="165" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.6" />
  <text x="535" y="115" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">✓ FASTAST ENGINE</text>

  <text x="527" y="148" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">AST Slicing + 1-Hop Graph Bundles</text>

  <rect x="527" y="162" width="430" height="150" rx="4" fill="#050e0b" stroke="#064e3b" />
  <text x="539" y="182" fill="#059669" font-family="monospace" font-size="11">$ fastast evidence "handle_graph" --max-tokens 1024</text>
  <text x="539" y="202" fill="#34d399" font-family="monospace" font-size="10">✓ AST Node: def handle_graph(self) (lines 84–110)</text>
  <text x="539" y="222" fill="#10b981" font-family="monospace" font-size="10">✓ Inbound Caller: FastASTAPIHandler.do_GET (line 218)</text>
  <text x="539" y="242" fill="#10b981" font-family="monospace" font-size="10">✓ Outbound Callee: get_call_graph (db.py:120)</text>
  <text x="539" y="262" fill="#10b981" font-family="monospace" font-size="10">✓ Imported Module: sqlite3, fastast.model</text>
  <text x="539" y="284" fill="#047857" font-family="monospace" font-size="10">✓ Strictly bounded within 1,024 token ceiling</text>

  <!-- Metrics Bar -->
  <rect x="527" y="325" width="430" height="52" rx="4" fill="#08231a" stroke="#047857" />
  <text x="539" y="345" fill="#6ee7b7" font-family="monospace" font-size="11">Prompt Consumption:</text>
  <text x="695" y="346" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold">~840 Tokens</text>
  <text x="820" y="346" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">(-98.0%)</text>
  <text x="539" y="365" fill="#059669" font-family="-apple-system, sans-serif" font-size="10">Sub-second response · Zero hallucination · Concentrated focus</text>

  <rect x="527" y="390" width="430" height="42" rx="4" fill="#061a13" />
  <text x="539" y="414" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">Result: Focused evidence, \$0.008 / turn cost</text>
</svg>

